<div class="group cursor-pointer flex flex-col h-full">
  <!-- Image / Visual Container -->
  <div
    class="relative h-52 sm:h-60 w-full mb-6 rounded-2xl overflow-hidden bg-[var(--text-primary)]/5 border border-[var(--secondary-primary)]/10 flex items-center justify-center"
  >
    <!-- Type Badge (Web / Mobile / etc.) -->
    <span
      *ngIf="type"
      class="absolute top-4 left-4 z-10 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full bg-[var(--accent-primary)]/20 text-[var(--text-primary)]/70 border border-[var(--accent-primary)]/30"
    >
      {{ type }}
    </span>

    <!-- Geometric SVG icon -->
    <svg
      class="w-24 h-24 text-[var(--text-primary)]/8 group-hover:text-[var(--text-primary)]/15 transition-colors duration-500"
      fill="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        *ngIf="type.includes('Mobile')"
        d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"
      />
      <path
        *ngIf="type === 'Web' || type === 'Web & Mobile'"
        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10z"
      />
    </svg>

    <!-- Pattern Overlay -->
    <div
      class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-10"
    ></div>
  </div>

  <!-- Content -->
  <div class="flex-1 flex flex-col">
    <!-- Title + Role -->
    <div class="mb-3">
      <h3
        class="text-lg font-bold text-[var(--text-primary)] group-hover:text-[var(--text-primary)]/80 transition-colors leading-snug mb-1"
      >
        {{ title }}
      </h3>
      <p
        *ngIf="role"
        class="text-xs text-[var(--accent-primary)]/80 font-semibold uppercase tracking-wider"
      >
        {{ role }}
      </p>
    </div>

    <!-- Category + Date -->
    <div
      class="flex justify-between items-center text-[10px] uppercase tracking-wider text-[var(--text-primary)]/40 mb-4 font-semibold"
    >
      <span>{{ category }}</span>
      <span>{{ date }}</span>
    </div>

    <!-- Description -->
    <p class="text-[var(--text-primary)]/60 text-sm leading-relaxed line-clamp-3 mb-5 flex-1">
      {{ description }}
    </p>

    <!-- Tech Stack Tags -->
    <div *ngIf="tags.length" class="flex flex-wrap gap-2 mt-auto">
      <span
        *ngFor="let tag of tags"
        class="text-[10px] font-medium px-2.5 py-1 rounded-full bg-[var(--text-primary)]/8 text-[var(--text-primary)]/60 border border-[var(--text-primary)]/10"
      >
        {{ tag }}
      </span>
    </div>
  </div>
</div>
