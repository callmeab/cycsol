<section class="py-24 bg-[#0a0a0a] relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center mb-20">
            <h2 class="text-4xl sm:text-5xl font-bold text-white mb-6">Our Testimonials</h2>
            <p class="text-gray-400 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed">
                Don't just take our word for it; hear what our satisfied clients have to say about their experience with
                Cycsol. We take pride in building lasting relationships and delivering exceptional results.
            </p>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <app-testimonial-card *ngFor="let testimonial of testimonials" [quote]="testimonial.quote"
                [authorName]="testimonial.name" [authorRole]="testimonial.role" [authorImage]="testimonial.image"
                class="h-full"></app-testimonial-card>
        </div>
    </div>
</section>
