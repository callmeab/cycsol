<div
    class="h-full p-8 md:p-10 rounded-[2rem] bg-gradient-to-b from-[var(--text-primary)]/10 to-[var(--bg-dark)] border border-[var(--secondary-primary)]/10 hover:border-[var(--secondary-primary)]/20 transition-all duration-500 group relative overflow-hidden flex flex-col items-center text-center">

    <!-- Background Grid Pattern (Subtle) -->
    <div
        class="absolute inset-0 bg-[url('/assets/grid-pattern.svg')] opacity-[0.03] pointer-events-none group-hover:opacity-[0.05] transition-opacity duration-500">
    </div>

    <!-- Hover Glow Effect -->
    <div
        class="absolute inset-0 bg-gradient-to-b from-purple-900/0 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none">
    </div>

    <!-- Top Spotlight -->
    <div
        class="absolute -top-20 left-1/2 -translate-x-1/2 w-40 h-40 bg-purple-500/10 blur-[60px] rounded-full pointer-events-none group-hover:bg-purple-500/20 transition-all duration-500">
    </div>


    <!-- Icon Container with Ripple/Glow -->
    <div class="relative mb-8 group">
        <!-- Ripple 1 -->
        <div
            class="absolute inset-0 -m-4 border border-[var(--secondary-primary)]/10 rounded-full opacity-0 group-hover:opacity-100 group-hover:scale-110 transition-all duration-700 delay-75">
        </div>
        <!-- Ripple 2 -->
        <div
            class="absolute inset-0 -m-8 border border-[var(--secondary-primary)]/5 rounded-full opacity-0 group-hover:opacity-50 group-hover:scale-125 transition-all duration-700 delay-150">
        </div>

        <div
            class="relative w-20 h-20 rounded-full bg-[var(--text-primary)]/10 flex items-center justify-center border border-[var(--text-primary)]/5 group-hover:border-[var(--text-primary)]/30 group-hover:shadow-[0_0_30px_-10px_rgba(var(--text-primary-rgb),0.4)] transition-all duration-500 z-10">
            <ng-container [ngSwitch]="iconName">
                <!-- E-commerce -->
                <svg *ngSwitchCase="'ecommerce'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>

                <!-- Digital Marketing -->
                <svg *ngSwitchCase="'marketing'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                </svg>

                <!-- SEO -->
                <svg *ngSwitchCase="'seo'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                </svg>

                <!-- Web/App Dev -->
                <svg *ngSwitchCase="'development'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>

                <!-- Web Design (Using brush/pencil icon) -->
                <svg *ngSwitchCase="'design'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                </svg>


                <!-- Game Dev -->
                <svg *ngSwitchCase="'game'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                </svg>

                <!-- Import/Export -->
                <svg *ngSwitchCase="'importexport'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>

                <!-- Medical Billing -->
                <svg *ngSwitchCase="'medical'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>

                <!-- Construction -->
                <svg *ngSwitchCase="'construction'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>

                <!-- Trucking -->
                <svg *ngSwitchCase="'trucking'"
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>

                <!-- Fallback: Default Icon -->
                <svg *ngSwitchDefault
                    class="w-8 h-8 text-[var(--text-primary)]/60 group-hover:text-[var(--text-primary)] transition-colors duration-300"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </ng-container>
        </div>
    </div>

    <!-- Title & Description -->
    <h3 class="text-2xl font-bold text-[var(--text-primary)] mb-4 relative z-10">{{ title }}</h3>
    <p class="text-[var(--text-primary)]/60 text-sm leading-relaxed mb-8 relative z-10 line-clamp-4">
        {{ description }}
    </p>

    <!-- Footer Area: Price & Button -->
    <div
        class="mt-auto w-full relative z-10 flex items-center justify-between border-t border-[var(--text-primary)]/5 pt-6">
        <div class="text-left" *ngIf="price">
            <span class="block text-[var(--text-primary)]/40 text-xs font-medium mb-1">Starts at Price</span>
            <span class="block text-[var(--text-primary)] font-bold text-lg">{{ price }}</span>
        </div>

        <!-- Button -->
        <button
            class="group/btn flex items-center gap-2 px-5 py-2.5 rounded-full bg-[var(--accent-primary)]/10 border border-[var(--accent-primary)]/10 hover:border-[var(--accent-primary)]/20 hover:bg-[var(--accent-primary)]/20 transition-all duration-300 ml-auto">
            <span class="text-sm font-medium text-[var(--text-primary)]">{{ buttonText }}</span>
            <div
                class="w-6 h-6 rounded-full bg-[var(--text-primary)]/10 flex items-center justify-center group-hover/btn:bg-[var(--text-primary)]/20 transition-colors">
                <svg class="w-3 h-3 text-[var(--text-primary)] transition-transform duration-300 group-hover/btn:-rotate-45"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </div>
        </button>
    </div>
</div>
