<section class="py-24 relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center mb-16">
            <h2 class="text-4xl sm:text-5xl font-bold text-white mb-6">Our Works</h2>
            <p class="text-gray-400 max-w-2xl mx-auto text-sm sm:text-base">
                Real-world projects delivered with precision. Our portfolio reflects successful collaborations across
                web platforms, mobile apps, and hybrid solutions — built with modern, scalable technologies.
            </p>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
            <div *ngFor="let work of works"
                class="bg-(--text-primary)/4 border border-(--text-primary)/8 rounded-2xl p-6 hover:border-(--text-primary)/20 hover:bg-(--text-primary)/7 transition-all duration-300">
                <app-work-card [title]="work.title" [role]="work.role" [category]="work.category" [date]="work.date"
                    [type]="work.type" [tags]="work.tags" [description]="work.description">
                </app-work-card>
            </div>
        </div>

    </div>
</section>
