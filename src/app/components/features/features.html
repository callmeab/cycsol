<section class="py-20  relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
        <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-4">
            Reasons to Choose Cycsol for <br />
            <span class="text-gray-500">Your Digital Journey</span>
        </h2>
        <p class="text-gray-400 max-w-2xl mx-auto">
            Partnering with Cycsol offers a multitude of advantages. Experience increased brand visibility, improved
            customer engagement, and higher ROI. Our tailored solutions are designed to meet your unique business needs,
            ensuring lasting success.
        </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <app-feature-card *ngFor="let feature of features" [title]="feature.title" [description]="feature.description"
            [iconName]="feature.icon"></app-feature-card>
    </div>
</section>
