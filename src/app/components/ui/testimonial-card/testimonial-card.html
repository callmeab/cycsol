<div class="flex flex-col h-full">
    <!-- Quote Bubble -->
    <div
        class="relative bg-[var(--text-primary)]/5 border border-[var(--text-primary)]/5 p-8 rounded-2xl mb-8 flex-grow">
        <!-- Twitter/social icon -->
        <div class="mb-6">
            <svg class="w-6 h-6 text-[var(--text-primary)]" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z" />
            </svg>
        </div>

        <p class="text-[var(--text-primary)]/70 text-sm sm:text-base leading-relaxed">
            {{ quote }}
        </p>

        <!-- Arrow down (Speech bubble tail) -->
        <div
            class="absolute -bottom-3 left-8 w-6 h-6 bg-[var(--text-primary)]/5 border-b border-r border-[var(--text-primary)]/5 rotate-45 transform">
        </div>
    </div>

    <!-- Author Info -->
    <div class="flex items-center gap-4 px-4">
        <!-- Avatar -->
        <div
            class="w-12 h-12 rounded-full overflow-hidden bg-[var(--text-primary)]/10 border border-[var(--text-primary)]/10 shrink-0">
            <img *ngIf="authorImage" [src]="authorImage" alt="{{authorName}}" class="w-full h-full object-cover">
            <div *ngIf="!authorImage"
                class="w-full h-full flex items-center justify-center bg-[var(--text-primary)]/20 text-[var(--text-primary)]/60 font-bold">
                {{ authorName.charAt(0) }}
            </div>
        </div>

        <!-- Text -->
        <div>
            <h4 class="text-[var(--text-primary)] font-bold text-base">{{ authorName }}</h4>
            <p class="text-[var(--text-primary)]/50 text-xs sm:text-sm">{{ authorRole }}</p>
        </div>
    </div>
</div>
