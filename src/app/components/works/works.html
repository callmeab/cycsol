<section class="py-24 bg-black relative">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="text-center mb-16">
            <h2 class="text-4xl sm:text-5xl font-bold text-white mb-6">Our Works</h2>
            <p class="text-gray-400 max-w-2xl mx-auto text-sm sm:text-base">
                Witness the brilliance of our previous projects. Our portfolio showcases the successful collaborations
                we've had with diverse clients across various industries. Let our work speak for itself.
            </p>
        </div>

        <!-- Grid -->
        <!-- Grid / Swiper -->
        <div
            class="flex md:grid md:grid-cols-2 gap-x-8 gap-y-16 mb-16 overflow-x-auto md:overflow-visible snap-x snap-mandatory -mx-4 px-4 md:mx-0 md:px-0 no-scrollbar pb-8 md:pb-0">
            <app-work-card *ngFor="let work of works" [title]="work.title" [category]="work.category" [date]="work.date"
                [description]="work.description"
                class="block min-w-[90vw] sm:min-w-[70vw] md:min-w-0 snap-center"></app-work-card>
        </div>

        <!-- Footer Button -->
        <div class="flex justify-center">
            <button
                class="bg-[#1a1a1a] hover:bg-[#252525] text-white px-8 py-3 rounded-full text-sm font-semibold transition-colors flex items-center gap-2 border border-white/5">
                View All Projects
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
            </button>
        </div>
    </div>
</section>
